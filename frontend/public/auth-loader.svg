<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="0.5" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <!-- faint track -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="6"/>
  <!-- spinning arc -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#ring)" stroke-width="6" stroke-linecap="round" stroke-dasharray="110 217">
    <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <!-- lock -->
  <path d="M47 57v-8a13 13 0 0 1 26 0v8" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <rect x="40" y="55" width="40" height="30" rx="9" fill="#fff"/>
  <circle cx="60" cy="68" r="4.5" fill="#7c3aed"/>
  <rect x="58.2" y="70" width="3.6" height="8" rx="1.8" fill="#7c3aed"/>
</svg>
