<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Loading">
  <!-- track -->
  <rect x="30" y="30" width="60" height="60" fill="none" stroke="#e4e4e7" stroke-width="2"/>
  <!-- line running around the square -->
  <rect x="30" y="30" width="60" height="60" fill="none" stroke="#111113" stroke-width="2" stroke-dasharray="56 184">
    <animate attributeName="stroke-dashoffset" from="0" to="-240" dur="1.4s" repeatCount="indefinite"/>
  </rect>
  <!-- upload mark -->
